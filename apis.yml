name: OnPlan
description: >-
  OnPlan (onplan.co) publishes guidance and content on project controls,
  budgeting, and forecasting for organizations managing projects and capital
  programs. The site covers cost planning and budget management, risk
  management frameworks, change control procedures, earned value management,
  and benefit realization tracking across infrastructure, construction, and
  technology projects. It is presented as an informational and educational
  resource rather than a self-service SaaS platform: at the time of enrichment
  the public surface consists of a homepage, a blog of dated articles, a
  contact page, a privacy policy, and a sitemap, with no developer portal,
  public API, documentation, pricing, sign-up/login, or terms-of-service pages
  exposed. This profile was surfaced as a VC-portfolio lead and enriched from
  the live site; no machine-readable API artifacts were found to harvest.
